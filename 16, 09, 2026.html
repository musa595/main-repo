        document.getElementById("1").innerHTML = student1.name + "<br>" + student1.age + "<br>" + student1.grade + "<br>" + student1.hobbies + "<br>" + student1.gamer + "<br>" + "<br>" + "<br>" + "<br>" + "<br>"
        document.getElementById("2").innerHTML = student2.name + "<br>" + student2.age + "<br>" + student2.grade + "<br>" + student2.hobbies + "<br>" + student2.gamer + "<br>"

    }
