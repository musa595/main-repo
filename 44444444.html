
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Event Data Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #fce7f3);
            margin: 0;
            padding: 35px 15px;
            text-align: center;
            color: #25324a;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px #0002;
        }

        h1 {
            color: #4f46e5;
        }

        button {
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #3730a3;
        }

        #loading {
            display: none;
            margin: 20px;
            color: #d97706;
            font-weight: bold;
        }

        .event-card {
            background: #f8fafc;
            border: 2px solid #c7d2fe;
            border-radius: 14px;
            padding: 18px;
            margin-top: 20px;
            text-align: left;
        }

        .event-card h2 {
            color: #4f46e5;
            margin-top: 0;
        }

        .json-box {
            background: #1e293b;
            color: #a7f3d0;
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            font-size: 13px;
        }

        .label {
            font-weight: bold;
            color: #475569;
        }

        .disclosure {
            font-size: 12px;
            color: #777;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🏫 School Event Data Viewer</h1>

    <p>
        Loading school events like a very serious computer 🤓
    </p>

    <button onclick="loadEvent()">Load Event Data 🚀</button>

    <div id="loading">⏳ Contacting the imaginary school server...</div>

    <div id="output"></div>

    <p class="disclosure">
        🤖 AI Disclosure: I used AI for help with ideas, code, and styling
        for this project.
    </p>
</div>

<script>
    function loadEvent() {
        const loading = document.getElementById("loading");
        const output = document.getElementById("output");

        loading.style.display = "block";
        output.innerHTML = "";

        // Simulate getting event data from a server
        setTimeout(function() {

            const eventData = {
                name: "School Fun Day 🎉",
                date: "November 15, 2026",
                location: "School Main Hall",
                organizer: "Student Council",
                activities: [
                    "Gaming Tournament 🎮",
                    "Art Competition 🎨",
                    "Quiz Challenge 🧠",
                    "Snack Break 🍕"
                ],
                status: "Registration Open"
            };

            // Convert JavaScript object into JSON text
            const jsonText = JSON.stringify(eventData, null, 2);

            // Parse JSON text back into a JavaScript object
            const parsedEvent = JSON.parse(jsonText);

            loading.style.display = "none";

            // Display the JSON text and final event details
            output.innerHTML = `
                <h2>📦 JSON Data</h2>
                <pre class="json-box"></pre>

                <div class="event-card">
                    <h2>🎪 ${parsedEvent.name}</h2>

                    <p>
                        <span class="label">📅 Date:</span>
                        ${parsedEvent.date}
                    </p>

                    <p>
                        <span class="label">📍 Location:</span>
                        ${parsedEvent.location}
                    </p>

                    <p>
                        <span class="label">👥 Organizer:</span>
                        ${parsedEvent.organizer}
                    </p>

                    <p>
                        <span class="label">✅ Status:</span>
                        ${parsedEvent.status}
                    </p>

                    <p class="label">🎯 Activities:</p>
                    <ul>
                        ${parsedEvent.activities.map(activity =>
                            `<li>${activity}</li>`
                        ).join("")}
                    </ul>
                </div>

                <p>✨ Data loaded successfully. The server survived!</p>
            `;

            // Put JSON into the text box safely
            output.querySelector(".json-box").textContent = jsonText;

        }, 1500);
    }
</script>

</body>
</html>
