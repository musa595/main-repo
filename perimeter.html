
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perimeter Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3fb;
            text-align: center;
            padding: 40px 15px;
            margin: 0;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            color: #2456a6;
        }

        select, input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 8px;
            font-size: 16px;
        }

        select, input {
            border: 1px solid #ccc;
        }

        button {
            background: #2456a6;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #173d7a;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            color: #168044;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>📐 Perimeter Calculator</h1>
    <p>Choose a shape and enter its measurements.</p>

    <select id="shape" onchange="showInputs()">
        <option value="square">Square</option>
        <option value="rectangle">Rectangle</option>
        <option value="triangle">Triangle</option>
        <option value="circle">Circle</option>
    </select>

    <div id="inputs"></div>

    <button onclick="calculatePerimeter()">Calculate Perimeter</button>

    <div id="result"></div>
</div>

<script>
    function showInputs() {
        const shape = document.getElementById("shape").value;
        const inputs = document.getElementById("inputs");

        if (shape === "square") {
            inputs.innerHTML =
                '<input type="number" id="side" placeholder="Enter side length" min="0" step="any">';
        } 
        else if (shape === "rectangle") {
            inputs.innerHTML =
                '<input type="number" id="length" placeholder="Enter length" min="0" step="any">' +
                '<input type="number" id="width" placeholder="Enter width" min="0" step="any">';
        } 
        else if (shape === "triangle") {
            inputs.innerHTML =
                '<input type="number" id="a" placeholder="First side" min="0" step="any">' +
                '<input type="number" id="b" placeholder="Second side" min="0" step="any">' +
                '<input type="number" id="c" placeholder="Third side" min="0" step="any">';
        } 
        else if (shape === "circle") {
            inputs.innerHTML =
                '<input type="number" id="radius" placeholder="Enter radius" min="0" step="any">';
        }

        document.getElementById("result").textContent = "";
    }

    function calculatePerimeter() {
        const shape = document.getElementById("shape").value;
        let perimeter;

        function getValue(id) {
            const field = document.getElementById(id);
            if (field.value.trim() === "") {
                return NaN;
            }
            return Number(field.value);
        }

        if (shape === "square") {
            const side = getValue("side");
            if (!Number.isFinite(side) || side <= 0) {
                showResult("Enter a side length greater than zero.", true);
                return;
            }
            perimeter = 4 * side;
        } 
        else if (shape === "rectangle") {
            const length = getValue("length");
            const width = getValue("width");

            if (!Number.isFinite(length) || !Number.isFinite(width) ||
                length <= 0 || width <= 0) {
                showResult("Enter both measurements greater than zero.", true);
                return;
            }
            perimeter = 2 * (length + width);
        } 
        else if (shape === "triangle") {
            const a = getValue("a");
            const b = getValue("b");
            const c = getValue("c");

            if (![a, b, c].every(Number.isFinite) ||
                a <= 0 || b <= 0 || c <= 0 ||
                a + b <= c || a + c <= b || b + c <= a) {
                showResult("Enter valid sides that can form a triangle.", true);
                return;
            }
            perimeter = a + b + c;
        } 
        else if (shape === "circle") {
            const radius = getValue("radius");

            if (!Number.isFinite(radius) || radius <= 0) {
                showResult("Enter a radius greater than zero.", true);
                return;
            }
            perimeter = 2 * Math.PI * radius;
        }

        showResult("Perimeter = " + Number(perimeter.toFixed(4)));
    }

    function showResult(message, isError = false) {
        const result = document.getElementById("result");
        result.textContent = message;
        result.style.color = isError ? "#c62828" : "#168044";
    }

    showInputs();
</script>

</body>
</html>
